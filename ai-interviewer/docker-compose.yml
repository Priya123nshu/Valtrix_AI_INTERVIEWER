services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: interviewer-backend
    ports:
      - "3001:3001"
    env_file:
      - ./apps/backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: interviewer-frontend
    ports:
      - "3002:3002"
    depends_on:
      - backend
    restart: unless-stopped
